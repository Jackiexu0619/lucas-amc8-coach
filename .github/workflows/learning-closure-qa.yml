name: Learning closure QA

on:
  push:
    paths:
      - 'coach_learning_closure_v06514.js'
      - 'qa_learning_closure_v06514.cjs'
      - 'coach_review_cycle_v065.js'
      - 'index.html'
      - '.github/workflows/learning-closure-qa.yml'
  pull_request:
    paths:
      - 'coach_learning_closure_v06514.js'
      - 'qa_learning_closure_v06514.cjs'
      - 'coach_review_cycle_v065.js'
      - 'index.html'
      - '.github/workflows/learning-closure-qa.yml'
  workflow_dispatch:

jobs:
  learning-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check learning closure
        run: node --check coach_learning_closure_v06514.js
      - name: Syntax check review queue
        run: node --check coach_review_cycle_v065.js
      - name: Inline script syntax check
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const pattern = /<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi;
          let match, count = 0;
          while ((match = pattern.exec(html)) !== null) {
            const source = match[1].trim();
            if (!source) continue;
            count++;
            new vm.Script(source, { filename: 'index.html:inline-' + count });
          }
          if (count < 1) throw new Error('No inline scripts found');
          process.stdout.write('PASS: syntax checked ' + count + ' inline script blocks\n');
          NODE
      - name: Learning closure integration QA
        run: node qa_learning_closure_v06514.cjs
