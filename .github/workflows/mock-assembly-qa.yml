name: AMC8 mock assembly QA

on:
  push:
    paths:
      - 'index.html'
      - 'coach_v064.js'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'coach_mock_assembly_v06514.js'
      - 'qa_mock_assembly_v06514.cjs'
      - 'qa_mock_answer_interaction_v06519.cjs'
      - 'qa_mock_learning_report_v06520.cjs'
      - 'coach_ai_explain_v06521.js'
      - 'coach_review_cycle_v065.js'
      - 'coach_ai_transfer_review_v066.js'
      - 'qa_ai_transfer_review_v066.cjs'
      - 'qa_review_queue_regeneration_v06522.cjs'
      - 'qa_hint_review_v06523.cjs'
      - 'qa_hint_review_browser_v06523.cjs'
      - 'qa_daily_history_v06524.cjs'
      - 'coach_report_sections_v06525.js'
      - 'qa_report_review_v06525.cjs'
      - 'DEVELOPMENT_PROGRESS.md'
      - 'qa_ai_explain_v06521.cjs'
      - 'qa_ai_explain_browser_v06521.cjs'
      - 'qa_ai_explain_live_v06521.cjs'
      - 'supabase/functions/amc8-explain/**'
      - 'supabase/migrations/*amc8_explain_quota.sql'
      - '.github/workflows/mock-assembly-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'coach_v064.js'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'coach_mock_assembly_v06514.js'
      - 'qa_mock_assembly_v06514.cjs'
      - 'qa_mock_answer_interaction_v06519.cjs'
      - 'qa_mock_learning_report_v06520.cjs'
      - 'coach_ai_explain_v06521.js'
      - 'coach_review_cycle_v065.js'
      - 'coach_ai_transfer_review_v066.js'
      - 'qa_ai_transfer_review_v066.cjs'
      - 'qa_review_queue_regeneration_v06522.cjs'
      - 'qa_hint_review_v06523.cjs'
      - 'qa_hint_review_browser_v06523.cjs'
      - 'qa_daily_history_v06524.cjs'
      - 'coach_report_sections_v06525.js'
      - 'qa_report_review_v06525.cjs'
      - 'DEVELOPMENT_PROGRESS.md'
      - 'qa_ai_explain_v06521.cjs'
      - 'qa_ai_explain_browser_v06521.cjs'
      - 'qa_ai_explain_live_v06521.cjs'
      - 'supabase/functions/amc8-explain/**'
      - 'supabase/migrations/*amc8_explain_quota.sql'
      - '.github/workflows/mock-assembly-qa.yml'
  workflow_dispatch:

jobs:
  mock-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check coach_mock_assembly_v06514.js && node --check coach_ai_explain_v06521.js && node --check coach_report_sections_v06525.js && node --check coach_review_cycle_v065.js && node --check coach_ai_transfer_review_v066.js && node --check supabase/functions/amc8-explain/core.mjs && node --check qa_ai_explain_live_v06521.cjs && node --check qa_ai_transfer_review_v066.cjs && node --check qa_review_queue_regeneration_v06522.cjs && node --check qa_hint_review_v06523.cjs && node --check qa_hint_review_browser_v06523.cjs && node --check qa_daily_history_v06524.cjs && node --check qa_report_review_v06525.cjs
      - name: Inline script syntax check
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const pattern=/<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi;
          let match,count=0;
          while((match=pattern.exec(html))!==null){if(match[1].trim()){new vm.Script(match[1],{filename:'index.html:inline-'+(++count)});}}
          if(!count)throw Error('No inline script found');
          NODE
      - name: Selector and integration QA
        run: node qa_mock_assembly_v06514.cjs
      - name: Interactive mock answer UX QA
        run: node qa_mock_answer_interaction_v06519.cjs
      - name: Per-question learning report QA
        run: node qa_mock_learning_report_v06520.cjs
      - name: On-demand DeepSeek explanation QA with mocked responses
        run: node qa_ai_explain_v06521.cjs
      - name: Review queue regeneration QA
        run: node qa_review_queue_regeneration_v06522.cjs
      - name: Hint-assisted official review QA
        run: node qa_hint_review_v06523.cjs
      - name: AI transfer review QA
        run: node qa_ai_transfer_review_v066.cjs
      - name: Isolated browser explanation QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node qa_ai_explain_browser_v06521.cjs
          node qa_hint_review_browser_v06523.cjs
          node qa_daily_history_v06524.cjs
          node qa_report_review_v06525.cjs
